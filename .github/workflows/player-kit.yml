name: Windows download

# Builds the Windows download (tools/player-kit/package.sh), as Toy
# Commander's (ToyCommander--QilinRecomp, the launcher's master copy): on
# every push, as an artifact to check; on a version tag (vX.Y.Z), attached
# to that tag's GitHub Release as GBTGhoulies--QilinRecomp-X.Y.Z-windows-x64.zip.
# No game data is used or included: players lift their own default.xbe with
# the bundled tools.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release and attach the download

env:
  LLVM_MINGW: "20261104"
  LLVM_MINGW_CROSS_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
  LLVM_MINGW_WINDOWS_SHA256: 552191b5754c49a5a20723276a6fc56541ea1922c4c50b7b669022333fc1b40f
  PACKAGE: GBTGhoulies--QilinRecomp
  TITLE: Grabbed by the Ghoulies

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the tags, for the version of an untagged build
      - name: Ninja and zip (Linux, for the cross build)
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build zip
      - name: Get the toolchains (pinned, checked)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          base=https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW
          curl -sSfL -o cross.tar.xz "$base/llvm-mingw-$LLVM_MINGW-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -sSfL -o windows.zip "$base/llvm-mingw-$LLVM_MINGW-ucrt-x86_64.zip"
          echo "$LLVM_MINGW_CROSS_SHA256  cross.tar.xz" | sha256sum -c
          echo "$LLVM_MINGW_WINDOWS_SHA256  windows.zip" | sha256sum -c
          mkdir cross windows
          tar xJf cross.tar.xz -C cross
          unzip -q windows.zip -d windows
          echo "LLVM_MINGW_CROSS=$PWD/cross/llvm-mingw-$LLVM_MINGW-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
          echo "LLVM_MINGW_WINDOWS=$PWD/windows/llvm-mingw-$LLVM_MINGW-ucrt-x86_64" >> "$GITHUB_ENV"
      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"
          else version="$(git describe --tags --always --match 'v*')"; version="${version#v}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tools/player-kit/package.sh "$version" "$PWD/$PACKAGE-$version-windows-x64.zip"
      - name: Check the download's layout
        run: |
          set -eu
          zip="$PACKAGE-$VERSION-windows-x64.zip"
          unzip -q "$zip" -d unpacked
          top="unpacked/$PACKAGE"
          for f in "Play $TITLE.exe" README.txt kit/qilin.exe kit/lib/libghoulies_kit.a kit/lib/icon.o kit/include/guest.hpp \
                   kit/build-flags.txt kit/game.txt kit/files.txt kit/VERSION kit/toolchain/bin/x86_64-w64-mingw32-clang++.exe \
                   LICENSES/llvm-mingw/LLVM-LICENSE.TXT LICENSES/nxdk/README.txt LICENSES/Zydis/LICENSE.txt; do
            [ -f "$top/$f" ] || { echo "missing: $f" >&2; exit 1; }
          done
          (cd "$top" && find . -type f | sed 's|^\./||' | LC_ALL=C sort) > present.txt
          tr -d '\r' < "$top/kit/files.txt" | LC_ALL=C sort > listed.txt
          diff listed.txt present.txt
          tr -d '\r' < "$top/kit/game.txt"
          tr -d '\r' < "$top/kit/build-flags.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}-${{ env.VERSION }}-windows-x64
          path: ${{ env.PACKAGE }}-${{ env.VERSION }}-windows-x64.zip
          retention-days: 14
      # The release may already be there (the Linux or macOS download's
      # workflow made it), or be made by one of them at the same moment:
      # upload if it exists, else create it, and once more after a pause if
      # that lost the race.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$PACKAGE-$VERSION-windows-x64.zip"
          attach() {
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "$zip" --title "$TITLE QilinRecomp $VERSION" \
                --notes "To play on Windows: download $zip below, unzip it, open the folder and double-click Play $TITLE.exe. Choose the folder you extracted your disc into (or drag it onto the window); the first start builds the game from it in a few minutes. You need your own disc, the USA release (MS-083), extracted to a folder (with extract-xiso or xdvdfs) holding default.xbe and the bundles, demand and xwavebank folders. Changes: CHANGELOG.md."
            fi
          }
          attach || { sleep 20; attach; }
