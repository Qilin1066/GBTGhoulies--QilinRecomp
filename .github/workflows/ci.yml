name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc14,   os: ubuntu-24.04,     cc: gcc-14,   cxx: g++-14 }
          - { name: linux-x64-clang19, os: ubuntu-24.04,     cc: clang-19, cxx: clang++-19 }
          - { name: linux-arm64-gcc14, os: ubuntu-24.04-arm, cc: gcc-14,   cxx: g++-14 }
          # macOS: built for macOS 12, the oldest MoltenVK supports, on Apple Silicon and Intel.
          - { name: macos-arm64,       os: macos-latest,   osx: '12.0' }
          - { name: macos-x64,         os: macos-15-intel, osx: '12.0' }
          - { name: windows-x64,       os: windows-2022 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # GCC 14's libstdc++ provides <print>; Clang on Linux uses it too.
      - name: Install compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 ${{ startsWith(matrix.cc, 'clang') && matrix.cc || '' }}
      - name: Configure
        shell: bash
        run: |
          args=()
          if [ -n "${{ matrix.osx }}" ]; then
            args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.osx }})
          fi
          if [ -n "${{ matrix.cxx }}" ]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQILIN_WERROR=ON "${args[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
